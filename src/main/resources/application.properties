# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# DataSource Configuration (PostgreSQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/authdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# 'validate' ensures that Hibernate checks entity mappings against the Flyway-managed schema at startup
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================
# Flyway Database Migration Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# JWT Security Configuration
# ==========================================
# 256-bit secret key (Base64 encoded) for HMAC-SHA256 signing
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Access Token: 15 minutes = 900000 milliseconds (15 * 60 * 1000)
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# Refresh Token: 7 days = 604800000 milliseconds (7 * 24 * 60 * 60 * 1000)
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}


