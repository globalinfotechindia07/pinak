# ==============================================================
# Super-App — Application Configuration
# Override with environment variables in production.
# ==============================================================

# ---- Server --------------------------------------------------
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.application.name=superapp

# ---- Actuator / Health Probes --------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${HEALTH_REDIS_ENABLED:false}
management.health.mail.enabled=false

# ---- DataSource (PostgreSQL) ---------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/superappdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---- JPA / Hibernate -----------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Flyway --------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- Redis Configuration ------------------------------------
# Supports individual host/port/password (or set SPRING_DATA_REDIS_URL directly in env)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}

# ---- JWT Security --------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER:superapp-api}
jwt.audience=${JWT_AUDIENCE:superapp-client}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ---- CORS ----------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---- Rate Limiting (Bucket4j — in-memory) --------------------
# Login: 100 attempts per 15 minutes per IP (dev friendly)
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:100}
app.rate-limit.login.refill-tokens=${RATE_LIMIT_LOGIN_REFILL:100}
app.rate-limit.login.refill-minutes=15
# Register: 100 per hour per IP
app.rate-limit.register.capacity=${RATE_LIMIT_REGISTER_CAPACITY:100}
app.rate-limit.register.refill-tokens=${RATE_LIMIT_REGISTER_REFILL:100}
app.rate-limit.register.refill-minutes=60
# Forgot password: 50 per hour per IP
app.rate-limit.forgot-password.capacity=50
app.rate-limit.forgot-password.refill-tokens=50
app.rate-limit.forgot-password.refill-minutes=60
# OTP verify: 100 per 15 minutes per IP
app.rate-limit.otp.capacity=${RATE_LIMIT_OTP_CAPACITY:100}
app.rate-limit.otp.refill-tokens=${RATE_LIMIT_OTP_REFILL:100}
app.rate-limit.otp.refill-minutes=15
# Refresh token: 100 per 15 minutes per IP
app.rate-limit.refresh.capacity=100
app.rate-limit.refresh.refill-tokens=100
app.rate-limit.refresh.refill-minutes=15

# ---- Mail (SMTP) ---------------------------------------------
# Set mail.mock=true for local dev — prints OTPs to log only
app.mail.mock=${MAIL_MOCK:true}
app.mail.from=${MAIL_FROM:noreply@superapp.com}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- OTP Configuration ---------------------------------------
# OTP TTL in minutes
app.otp.expiry-minutes=15
# Max OTP verification attempts before token is invalidated
app.otp.max-attempts=5
# OTP length (digits)
app.otp.length=6

# ---- Session -------------------------------------------------
# Session TTL in days (matches refresh token)
app.session.expiry-days=7

# ---- Springdoc / Swagger -------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Disable swagger in production by setting this to false
springdoc.swagger-ui.enabled=true

# ---- Async ---------------------------------------------------
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# ---- Logging -------------------------------------------------
logging.level.com.superapp=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
