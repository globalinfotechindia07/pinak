# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# DataSource Configuration (H2 In-Memory with PostgreSQL mode)
# Override via DB_URL, DB_USERNAME, DB_PASSWORD for external PostgreSQL
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
# 'validate' ensures that Hibernate checks entity mappings against the Flyway-managed schema at startup
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Flyway Database Migration Configuration
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# H2 Console Configuration (available at /h2-console)
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# JWT Security Configuration
# ==========================================
# 256-bit secret key (Base64 encoded) for HMAC-SHA256 signing
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 15 minutes = 900000 milliseconds (15 * 60 * 1000)
jwt.expiration=900000

