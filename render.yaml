# ==============================================================
# Render Blueprint Specification (render.yaml)
# https://render.com/docs/blueprint-spec
# NOTE: Secrets are NOT embedded here; they are configured via
# sync: false (to be supplied securely in the Render Dashboard).
# ==============================================================

services:
  - type: web
    name: superapp-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon # Or singapore, frankfurt, ohio
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: superapp-api
      - key: JWT_AUDIENCE
        value: superapp-client
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_MOCK
        value: "true"
      - key: LOG_LEVEL_APP
        value: INFO
      - key: LOG_LEVEL_SPRING
        value: INFO
